spring.application.name=educonnect
server.port=8080
server.compression.enabled=true
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never

# Banco de dados (H2 em arquivo). Para produção, troque por PostgreSQL/MySQL.
spring.datasource.url=jdbc:h2:file:./data/educonnect
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# RNF-C.5 - falhas do sistema registradas em arquivo
logging.file.name=logs/educonnect.log
logging.level.br.ucsal.educonnect=INFO

# Regras acadêmicas (escala 0 a 10)
educonnect.escala-maxima=10.0
educonnect.media-minima=6.0
educonnect.frequencia-minima=75.0

# Dados de demonstração (só criados se o banco estiver vazio)
educonnect.seed.enabled=true
educonnect.seed.senha=Edu@12345

# RNF-C.2 - backup diário às 02:00
educonnect.backup.dir=backups
educonnect.backup.cron=0 0 2 * * *

# Identidade visual (logo, nome e slogan exibidos no topo, no login e no rodapé)
# Para usar outra logo, coloque a imagem em src/main/resources/static/img/ e informe o caminho,
# por exemplo: educonnect.marca.logo=/img/minha-logo.png  (vazio = símbolo SVG padrão)
# As cores da logo e do tema ficam no início de static/css/app.css.
educonnect.marca.nome=EduConnect
educonnect.marca.slogan=Gest\u00e3o acad\u00eamica conectada
educonnect.marca.logo=

# Anexos das denúncias (pedido do cliente na validação do RF09): até 3 arquivos de 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

# E-mail (aviso de status da denúncia e "Esqueci minha senha"). Sem spring.mail.host,
# os e-mails são apenas registrados no log (modo demonstração). Exemplo para produção:
# spring.mail.host=smtp.instituicao.br
# spring.mail.port=587
# spring.mail.username=educonnect@instituicao.br
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.starttls.enable=true
educonnect.mail.remetente=nao-responda@educonnect.local
# Endereço público usado no link de redefinição de senha (vazio = endereço da requisição)
educonnect.url-base=
