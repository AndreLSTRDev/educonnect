spring.application.name=educonnect
server.port=8080
server.compression.enabled=true
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never

# Banco de dados (H2 em arquivo). Para produção, troque por PostgreSQL/MySQL.
spring.datasource.url=jdbc:h2:file:./data/educonnect
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# RNF-C.5 - falhas do sistema registradas em arquivo
logging.file.name=logs/educonnect.log
logging.level.br.ucsal.educonnect=INFO

# Regras acadêmicas (escala 0 a 10)
educonnect.escala-maxima=10.0
educonnect.media-minima=6.0
educonnect.frequencia-minima=75.0

# Dados de demonstração (só criados se o banco estiver vazio)
educonnect.seed.enabled=true
educonnect.seed.senha=Edu@12345

# RNF-C.2 - backup diário às 02:00
educonnect.backup.dir=backups
educonnect.backup.cron=0 0 2 * * *
