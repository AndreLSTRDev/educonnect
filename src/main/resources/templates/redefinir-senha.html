<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nova senha')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card"><div class="card-body p-4">
                <h1 class="h4 mb-3">Criar nova senha</h1>
                <div th:replace="~{fragments :: mensagens}"></div>
                <div th:unless="${tokenValido}" class="alert alert-warning d-flex gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                    <span>Este link é inválido, já foi usado ou expirou. <a th:href="@{/recuperar-senha}">Peça um novo link</a>.</span>
                </div>
                <form method="post" th:action="@{/redefinir-senha}" th:if="${tokenValido}">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="mb-3">
                        <label for="senha" class="form-label">Nova senha <span class="req" aria-hidden="true">*</span></label>
                        <input id="senha" name="senha" type="password" class="form-control" required minlength="8"
                               autocomplete="new-password" aria-describedby="ajudaSenha">
                        <div id="ajudaSenha" class="form-text">Mínimo de 8 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmacao" class="form-label">Confirme a nova senha <span class="req" aria-hidden="true">*</span></label>
                        <input id="confirmacao" name="confirmacao" type="password" class="form-control" required minlength="8"
                               autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
                </form>
            </div></div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
