<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Esqueci minha senha')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card"><div class="card-body p-4">
                <a th:href="@{/login}" class="small">&larr; Voltar ao login</a>
                <h1 class="h4 mt-3 mb-2">Esqueci minha senha</h1>
                <p class="text-muted">Informe o seu identificador institucional ou e-mail. Enviaremos ao e-mail cadastrado
                    um link para criar uma nova senha.</p>
                <div th:replace="~{fragments :: mensagens}"></div>
                <form method="post" th:action="@{/recuperar-senha}">
                    <label for="identificador" class="form-label">Identificador institucional ou e-mail <span class="req" aria-hidden="true">*</span></label>
                    <div class="ec-input-icone mb-3">
                        <i class="bi bi-person" aria-hidden="true"></i>
                        <input id="identificador" name="identificador" class="form-control" required autofocus autocomplete="username">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar link</button>
                </form>
                <p class="form-text mt-3 mb-0">Sem e-mail cadastrado? Procure a secretaria para redefinir a senha.</p>
            </div></div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
