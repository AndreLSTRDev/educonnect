<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-5">
    <div class="alert alert-warning" role="alert">
        <h1 class="h4" th:switch="${status}">
            <span th:case="403">Acesso negado</span>
            <span th:case="404">Página não encontrada</span>
            <span th:case="*">Algo deu errado</span>
        </h1>
        <p class="mb-2" th:if="${status == 403}">Você não tem permissão para acessar este conteúdo.</p>
        <p class="mb-2" th:if="${status == 404}">O endereço informado não existe ou o registro foi removido.</p>
        <p class="mb-2" th:if="${status != 403 and status != 404}">Ocorreu um erro inesperado. A falha foi registrada; tente novamente em instantes.</p>
        <a th:href="@{/painel}" class="btn btn-primary">Voltar ao início</a>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
