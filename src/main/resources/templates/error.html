<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div class="card ec-erro"><div class="card-body p-4 p-md-5">
        <span class="ec-icone laranja" th:switch="${status}">
            <i th:case="403" class="bi bi-lock" aria-hidden="true"></i>
            <i th:case="404" class="bi bi-signpost-split" aria-hidden="true"></i>
            <i th:case="*" class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        </span>
        <h1 class="h3" th:switch="${status}">
            <span th:case="403">Acesso negado</span>
            <span th:case="404">Página não encontrada</span>
            <span th:case="*">Algo deu errado</span>
        </h1>
        <p class="text-muted mb-4" th:if="${status == 403}">Você não tem permissão para acessar este conteúdo.</p>
        <p class="text-muted mb-4" th:if="${status == 404}">O endereço informado não existe ou o registro foi removido.</p>
        <p class="text-muted mb-4" th:if="${status != 403 and status != 404}">Ocorreu um erro inesperado. A falha foi registrada; tente novamente em instantes.</p>
        <a th:href="@{/painel}" class="btn btn-primary"><i class="bi bi-house me-1" aria-hidden="true"></i> Voltar ao início</a>
    </div></div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
