<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Denúncias')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <div class="ec-boas-vindas">
        <h1>Gerenciar denúncias</h1>
        <p>Analise as denúncias registradas, atualize o status e mantenha o histórico de cada caso.</p>
    </div>

    <!-- Pedido do cliente (RF10): filtros por status, categoria, período, aluno e protocolo -->
    <form method="get" class="card mb-3" th:action="@{/gestor}" role="search" aria-label="Filtrar denúncias">
        <div class="card-body row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label for="status" class="form-label">Status</label>
                <select id="status" name="status" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="s : ${todosStatus}" th:value="${s}" th:text="${s.rotulo}" th:selected="${s == filtro.status()}">S</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="categoria" class="form-label">Categoria</label>
                <select id="categoria" name="categoria" class="form-select">
                    <option value="">Todas</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.rotulo}" th:selected="${c == filtro.categoria()}">C</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="de" class="form-label">Aberta de</label>
                <input id="de" name="de" type="date" class="form-control" th:value="${filtro.de()}">
            </div>
            <div class="col-6 col-md-2">
                <label for="ate" class="form-label">até</label>
                <input id="ate" name="ate" type="date" class="form-control" th:value="${filtro.ate()}">
            </div>
            <div class="col-6 col-md-2">
                <label for="aluno" class="form-label">Aluno</label>
                <input id="aluno" name="aluno" class="form-control" th:value="${filtro.aluno()}" placeholder="Nome">
            </div>
            <div class="col-6 col-md-2">
                <label for="protocolo" class="form-label">Protocolo</label>
                <input id="protocolo" name="protocolo" class="form-control" th:value="${filtro.protocolo()}" placeholder="EDU-2026-...">
            </div>
            <div class="col-12 d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-funnel me-1" aria-hidden="true"></i>Filtrar</button>
                <a class="btn btn-link" th:href="@{/gestor}" th:if="${filtrando}">Limpar filtros</a>
                <span class="ms-auto small text-muted" th:text="${denuncias.size()} + ' denúncia(s)'">0 denúncias</span>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Denúncias registradas</caption>
                <thead><tr><th scope="col">Protocolo</th><th scope="col">Título</th><th scope="col">Categoria</th>
                    <th scope="col">Aluno</th><th scope="col">Abertura</th><th scope="col">Status</th><th scope="col"></th></tr></thead>
                <tbody>
                <tr th:each="d : ${denuncias}">
                    <td th:text="${d.protocolo}">EDU</td>
                    <td th:text="${d.titulo}">Título</td>
                    <td th:text="${d.categoria.rotulo}">Cat</td>
                    <td>
                        <span th:text="${d.autorExibido}" th:classappend="${d.anonima} ? 'text-muted fst-italic'">Aluno</span>
                        <i class="bi bi-paperclip text-muted ms-1" th:unless="${d.anexos.isEmpty()}"
                           th:attr="aria-label=${d.anexos.size()} + ' anexo(s)',title=${d.anexos.size()} + ' anexo(s)'"></i>
                    </td>
                    <td th:text="${#temporals.format(d.dataAbertura, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${d.status.cor}" th:text="${d.status.rotulo}">Status</span></td>
                    <td><a class="btn btn-sm btn-primary" th:href="@{/gestor/denuncias/{id}(id=${d.id})}">Analisar</a></td>
                </tr>
                <tr th:if="${denuncias.isEmpty()}"><td colspan="7" class="text-muted">Nenhuma denúncia encontrada.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
