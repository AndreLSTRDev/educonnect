<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Acompanhar denúncia')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <a th:href="@{/aluno/denuncias}" class="small">&larr; Minhas denúncias</a>
    <div class="card my-3"><div class="card-body">
        <div class="d-flex flex-wrap justify-content-between gap-2">
            <h1 class="h4 mb-0" th:text="${denuncia.titulo}">Título</h1>
            <span class="badge align-self-start" th:classappend="'text-bg-' + ${denuncia.status.cor}" th:text="${denuncia.status.rotulo}">Status</span>
        </div>
        <p class="text-muted mb-2">Protocolo <strong th:text="${denuncia.protocolo}">EDU</strong>
            · <span th:text="${denuncia.categoria.rotulo}">Cat</span>
            · <span th:text="${#temporals.format(denuncia.dataAbertura, 'dd/MM/yyyy HH:mm')}">data</span>
            <span class="badge text-bg-secondary ms-1" th:if="${denuncia.anonima}"><i class="bi bi-incognito" aria-hidden="true"></i> Anônima</span></p>
        <p style="white-space: pre-wrap" th:text="${denuncia.descricao}">Descrição</p>
        <div th:unless="${denuncia.anexos.isEmpty()}">
            <h2 class="h6">Anexos</h2>
            <ul class="list-unstyled mb-0">
                <li th:each="a : ${denuncia.anexos}"><i class="bi bi-paperclip" aria-hidden="true"></i>
                    <a th:href="@{/aluno/anexos/{id}(id=${a.id})}" th:text="${a.nomeArquivo}">arquivo.pdf</a>
                    <span class="text-muted small" th:text="'(' + ${a.tamanhoFormatado} + ')'">(10 KB)</span></li>
            </ul>
        </div>
    </div></div>

    <h2 class="h5">Andamento</h2>
    <ol class="list-group list-group-numbered">
        <li class="list-group-item" th:each="h : ${denuncia.historico}">
            <strong th:text="${h.statusNovo.rotulo}">Status</strong>
            <span class="text-muted small" th:text="' – ' + ${#temporals.format(h.dataAlteracao, 'dd/MM/yyyy HH:mm')}">data</span>
            <div th:if="${h.comentario != null}" th:text="${h.comentario}">Comentário</div>
        </li>
    </ol>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
