<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Denúncias')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <h1 class="h3 mb-3">Denúncias</h1>

    <div class="card mb-4"><div class="card-body">
        <h2 class="h5">Registrar denúncia</h2>
        <p class="text-muted small"><span class="req" aria-hidden="true">*</span> campo obrigatório</p>
        <form method="post" th:action="@{/aluno/denuncias}">
            <div class="row g-3">
                <div class="col-12 col-md-8">
                    <label for="titulo" class="form-label">Título <span class="req" aria-hidden="true">*</span></label>
                    <input id="titulo" name="titulo" class="form-control" required maxlength="120">
                </div>
                <div class="col-12 col-md-4">
                    <label for="categoria" class="form-label">Categoria <span class="req" aria-hidden="true">*</span></label>
                    <select id="categoria" name="categoria" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.rotulo}">Cat</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição <span class="req" aria-hidden="true">*</span></label>
                    <textarea id="descricao" name="descricao" class="form-control" rows="4" required maxlength="2000"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Enviar denúncia</button>
        </form>
    </div></div>

    <h2 class="h5">Minhas denúncias</h2>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Denúncias registradas por você</caption>
                <thead><tr><th scope="col">Protocolo</th><th scope="col">Título</th><th scope="col">Categoria</th>
                    <th scope="col">Abertura</th><th scope="col">Status</th><th scope="col"></th></tr></thead>
                <tbody>
                <tr th:each="d : ${denuncias}">
                    <td th:text="${d.protocolo}">EDU-2026-000000</td>
                    <td th:text="${d.titulo}">Título</td>
                    <td th:text="${d.categoria.rotulo}">Cat</td>
                    <td th:text="${#temporals.format(d.dataAbertura, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${d.status.cor}" th:text="${d.status.rotulo}">Status</span></td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{/aluno/denuncias/{id}(id=${d.id})}">Acompanhar</a></td>
                </tr>
                <tr th:if="${denuncias.isEmpty()}"><td colspan="6" class="text-muted">Você ainda não registrou denúncias.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
