<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Painel do aluno')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <div class="ec-boas-vindas">
        <h1 th:text="'Olá, ' + ${logado.nome}">Olá</h1>
        <p>Acompanhe sua vida acadêmica<span th:if="${periodoAtual != null}" th:text="' no período ' + ${periodoAtual}"></span>.</p>
    </div>
    <div class="row g-3">
        <div class="col-12 col-md-4">
            <a class="card ec-atalho text-decoration-none h-100" th:href="@{/aluno/desempenho}">
                <div class="card-body">
                    <span class="ec-icone"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i></span>
                    <h2 class="h5 mb-1">Desempenho</h2>
                    <p class="mb-0 text-muted">Médias, frequência e situação por disciplina.</p>
                    <span class="ec-seta">Ver desempenho <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
                </div>
            </a>
        </div>
        <div class="col-12 col-md-4">
            <a class="card ec-atalho text-decoration-none h-100" th:href="@{/aluno/historico}">
                <div class="card-body">
                    <span class="ec-icone verde"><i class="bi bi-clock-history" aria-hidden="true"></i></span>
                    <h2 class="h5 mb-1">Histórico acadêmico</h2>
                    <p class="mb-0 text-muted">Disciplinas cursadas, notas e resultados.</p>
                    <span class="ec-seta">Ver histórico <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
                </div>
            </a>
        </div>
        <div class="col-12 col-md-4">
            <a class="card ec-atalho text-decoration-none h-100" th:href="@{/aluno/denuncias}">
                <div class="card-body">
                    <span class="ec-icone rosa"><i class="bi bi-shield-exclamation" aria-hidden="true"></i></span>
                    <h2 class="h5 mb-1">Denúncias</h2>
                    <p class="mb-0 text-muted">Registre e acompanhe (<span th:text="${totalDenuncias}">0</span> registrada(s)).</p>
                    <span class="ec-seta">Abrir denúncias <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
                </div>
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
