<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' – ' + ${marca.nome}">EduConnect</title>
    <!-- Aplica o tema salvo antes de desenhar a página (evita o "piscar" do tema claro) -->
    <script>
        (function () {
            try {
                var tema = localStorage.getItem('ec-tema') || 'claro';
                var cor = localStorage.getItem('ec-cor') || 'indigo';
                if (tema === 'auto') {
                    tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
                }
                var raiz = document.documentElement;
                raiz.setAttribute('data-tema', tema);
                raiz.setAttribute('data-bs-theme', tema === 'escuro' ? 'dark' : 'light');
                if (cor !== 'indigo') { raiz.setAttribute('data-cor', cor); }
            } catch (e) { /* sem localStorage: fica o tema claro */ }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<!--
  LOGO DO EDUCONNECT
  - Cores: altere --ec-logo-cor-1 e --ec-logo-cor-2 em static/css/app.css.
  - Nome e slogan: educonnect.marca.nome / educonnect.marca.slogan em application.properties.
  - Trocar por outra imagem: informe educonnect.marca.logo (ex.: /img/minha-logo.png).
    Com a propriedade vazia, o símbolo SVG abaixo é usado.
-->
<th:block th:fragment="simbolo(tamanho, id)">
    <img th:if="${!#strings.isEmpty(marca.logo)}" th:src="@{${marca.logo}}" class="ec-logo"
         th:width="${tamanho}" th:height="${tamanho}" alt="" aria-hidden="true">
    <svg th:if="${#strings.isEmpty(marca.logo)}" class="ec-logo" viewBox="0 0 48 48"
         th:width="${tamanho}" th:height="${tamanho}" aria-hidden="true" focusable="false"
         xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient th:id="${id}" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0" style="stop-color: var(--ec-logo-cor-1)"/>
                <stop offset="1" style="stop-color: var(--ec-logo-cor-2)"/>
            </linearGradient>
        </defs>
        <rect width="48" height="48" rx="13" th:attr="fill='url(#' + ${id} + ')'"/>
        <!-- "E" formado por três traços; as pontas viram nós conectados (Edu + Connect) -->
        <path d="M33 14.5 L29.5 24 L33 33.5" fill="none" stroke="#fff" stroke-opacity=".55"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="12" y="12" width="4.5" height="24" rx="2.25" fill="#fff"/>
        <rect x="12" y="12" width="17" height="4.5" rx="2.25" fill="#fff"/>
        <rect x="12" y="21.75" width="13.5" height="4.5" rx="2.25" fill="#fff"/>
        <rect x="12" y="31.5" width="17" height="4.5" rx="2.25" fill="#fff"/>
        <circle cx="33" cy="14.25" r="3.6" fill="#fff"/>
        <circle cx="29.5" cy="24" r="3.6" fill="#fff"/>
        <circle cx="33" cy="33.75" r="3.6" fill="#fff"/>
    </svg>
</th:block>

<a th:fragment="marca(id)" class="ec-marca" th:href="@{/painel}">
    <th:block th:replace="~{fragments :: simbolo(36, ${id})}"></th:block>
    <span class="ec-marca-texto">
        <span class="ec-marca-nome" th:text="${marca.nome}">EduConnect</span>
        <span class="ec-marca-slogan" th:text="${marca.slogan}">Gestão acadêmica conectada</span>
    </span>
</a>

<header th:fragment="nav" class="ec-topo">
    <a class="visually-hidden-focusable ec-pular" href="#conteudo">Ir para o conteúdo</a>
    <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
        <div class="container">
            <a th:replace="~{fragments :: marca('ec-logo-nav')}"></a>
            <div class="d-flex align-items-center gap-2 ms-auto order-lg-last">
                <!-- Pedido do cliente (validação do RF01): modo escuro e troca de tema -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary ec-tema-btn" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false" aria-label="Aparência: tema e cor" title="Aparência">
                        <i class="bi bi-circle-half" aria-hidden="true"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end ec-tema-menu">
                        <li><h2 class="dropdown-header">Tema</h2></li>
                        <li><button class="dropdown-item" type="button" data-ec-tema="claro"><i class="bi bi-sun me-2" aria-hidden="true"></i>Claro</button></li>
                        <li><button class="dropdown-item" type="button" data-ec-tema="escuro"><i class="bi bi-moon-stars me-2" aria-hidden="true"></i>Escuro</button></li>
                        <li><button class="dropdown-item" type="button" data-ec-tema="auto"><i class="bi bi-display me-2" aria-hidden="true"></i>Igual ao sistema</button></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><h2 class="dropdown-header">Cor de destaque</h2></li>
                        <li><button class="dropdown-item" type="button" data-ec-cor="indigo"><span class="ec-bolinha me-2" style="background:#4f46e5" aria-hidden="true"></span>Índigo</button></li>
                        <li><button class="dropdown-item" type="button" data-ec-cor="azul"><span class="ec-bolinha me-2" style="background:#2563eb" aria-hidden="true"></span>Azul</button></li>
                        <li><button class="dropdown-item" type="button" data-ec-cor="verde"><span class="ec-bolinha me-2" style="background:#0f766e" aria-hidden="true"></span>Verde-água</button></li>
                    </ul>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                        th:if="${logado != null}"
                        aria-controls="menu" aria-expanded="false" aria-label="Alternar menu">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="menu" th:if="${logado != null}">
                <ul class="navbar-nav mx-lg-auto ec-menu">
                    <li class="nav-item"><a class="nav-link" th:href="@{/painel}"
                        th:classappend="${caminhoAtual == '/admin' or caminhoAtual == '/professor' or caminhoAtual == '/aluno' or caminhoAtual == '/gestor'} ? 'active'">
                        <i class="bi bi-house" aria-hidden="true"></i> Início</a></li>
                    <th:block th:if="${logado.perfil.name() == 'ADMINISTRADOR'}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}"
                            th:classappend="${#strings.startsWith(caminhoAtual, '/admin/usuarios')} ? 'active'">
                            <i class="bi bi-people" aria-hidden="true"></i> Usuários</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/cursos}"
                            th:classappend="${#strings.startsWith(caminhoAtual, '/admin/cursos')} ? 'active'">
                            <i class="bi bi-journal-bookmark" aria-hidden="true"></i> Cursos e disciplinas</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/turmas}"
                            th:classappend="${#strings.startsWith(caminhoAtual, '/admin/turmas')} ? 'active'">
                            <i class="bi bi-diagram-3" aria-hidden="true"></i> Turmas</a></li>
                    </th:block>
                    <th:block th:if="${logado.perfil.name() == 'ALUNO'}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/aluno/desempenho}"
                            th:classappend="${#strings.startsWith(caminhoAtual, '/aluno/desempenho')} ? 'active'">
                            <i class="bi bi-graph-up" aria-hidden="true"></i> Desempenho</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/aluno/historico}"
                            th:classappend="${#strings.startsWith(caminhoAtual, '/aluno/historico')} ? 'active'">
                            <i class="bi bi-clock-history" aria-hidden="true"></i> Histórico</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/aluno/denuncias}"
                            th:classappend="${#strings.startsWith(caminhoAtual, '/aluno/denuncias')} ? 'active'">
                            <i class="bi bi-shield-exclamation" aria-hidden="true"></i> Denúncias</a></li>
                    </th:block>
                </ul>
                <form class="ec-usuario" th:action="@{/logout}" method="post">
                    <span class="ec-avatar" aria-hidden="true" th:text="${#strings.substring(logado.nome, 0, 1)}">A</span>
                    <span class="ec-usuario-dados">
                        <span class="ec-usuario-nome" th:text="${logado.nome}">Nome</span>
                        <span class="ec-usuario-perfil" th:text="${logado.perfil.rotulo}">Perfil</span>
                    </span>
                    <button type="submit" class="btn btn-sm btn-outline-secondary ms-lg-2">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair</button>
                </form>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="mensagens">
    <div th:if="${erro}" class="alert alert-danger d-flex gap-2" role="alert">
        <i class="bi bi-exclamation-octagon" aria-hidden="true"></i><span th:text="${erro}"></span></div>
    <div th:if="${sucesso}" class="alert alert-success d-flex gap-2" role="status">
        <i class="bi bi-check-circle" aria-hidden="true"></i><span th:text="${sucesso}"></span></div>
</div>

<footer th:fragment="rodape" class="ec-rodape">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span><strong th:text="${marca.nome}">EduConnect</strong> · <span th:text="${marca.slogan}">slogan</span></span>
        <span>Engenharia de Requisitos · UCSAL 2026</span>
    </div>
</footer>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:fragment="app" th:src="@{/js/app.js}"></script>

</body>
</html>
