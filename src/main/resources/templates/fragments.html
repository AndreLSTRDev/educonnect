<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' – EduConnect'">EduConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:fragment="nav">
    <a class="visually-hidden-focusable" href="#conteudo">Ir para o conteúdo</a>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand" th:href="@{/painel}">EduConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Alternar menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu" th:if="${logado != null}">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/painel}">Início</a></li>
                    <th:block th:if="${logado.perfil.name() == 'ADMINISTRADOR'}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}">Usuários</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/cursos}">Cursos e disciplinas</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/turmas}">Turmas</a></li>
                    </th:block>
                    <th:block th:if="${logado.perfil.name() == 'ALUNO'}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/aluno/desempenho}">Desempenho</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/aluno/historico}">Histórico</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/aluno/denuncias}">Denúncias</a></li>
                    </th:block>
                    <th:block th:if="${logado.perfil.name() == 'GESTOR_DENUNCIAS'}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/gestor}">Denúncias</a></li>
                    </th:block>
                </ul>
                <form class="d-flex align-items-center gap-2" th:action="@{/logout}" method="post">
                    <span class="text-white small" th:text="${logado.nome} + ' (' + ${logado.perfil.rotulo} + ')'">Nome</span>
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="mensagens">
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
    <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:fragment="app" th:src="@{/js/app.js}"></script>

</body>
</html>
