<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuários</h1>
        <a class="btn btn-primary" th:href="@{/admin/usuarios/novo}">Novo usuário</a>
    </div>
    <form method="get" class="row g-2 align-items-end mb-3" th:action="@{/admin/usuarios}" role="search">
        <div class="col-12 col-md-5">
            <label for="busca" class="form-label">Buscar</label>
            <div class="ec-input-icone">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input id="busca" name="busca" type="search" class="form-control" th:value="${busca}"
                       placeholder="Nome, identificador ou e-mail">
            </div>
        </div>
        <div class="col-8 col-md-3">
            <label for="perfil" class="form-label">Perfil</label>
            <select id="perfil" name="perfil" class="form-select">
                <option value="">Todos</option>
                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.rotulo}" th:selected="${p == perfilFiltro}">Perfil</option>
            </select>
        </div>
        <div class="col-auto"><button type="submit" class="btn btn-outline-secondary"><i class="bi bi-funnel me-1" aria-hidden="true"></i>Filtrar</button></div>
        <div class="col-auto" th:if="${busca != null and !busca.isBlank() or perfilFiltro != null}">
            <a class="btn btn-link" th:href="@{/admin/usuarios}">Limpar</a></div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Lista de usuários cadastrados</caption>
                <thead>
                <tr><th scope="col">Nome</th><th scope="col">Identificador</th><th scope="col">Perfil</th>
                    <th scope="col">Situação</th><th scope="col">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.nomeCompleto}">Nome</td>
                    <td th:text="${u.identificadorInstitucional}">id</td>
                    <td th:text="${u.perfil.rotulo}">Perfil</td>
                    <td>
                        <span th:if="${u.ativo}" class="badge text-bg-success">Ativo</span>
                        <span th:unless="${u.ativo}" class="badge text-bg-secondary">Desativado</span>
                    </td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}"
                           th:attr="aria-label='Editar ' + ${u.nomeCompleto}">Editar</a>
                        <form class="d-inline" method="post" th:if="${u.ativo}" th:action="@{/admin/usuarios/{id}/desativar(id=${u.id})}">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:attr="aria-label='Desativar ' + ${u.nomeCompleto}">Desativar</button>
                        </form>
                        <form class="d-inline" method="post" th:unless="${u.ativo}" th:action="@{/admin/usuarios/{id}/ativar(id=${u.id})}">
                            <button type="submit" class="btn btn-sm btn-outline-success"
                                    th:attr="aria-label='Reativar ' + ${u.nomeCompleto}">Reativar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${usuarios.isEmpty()}"><td colspan="5" class="text-muted">Nenhum usuário encontrado com esses filtros.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
