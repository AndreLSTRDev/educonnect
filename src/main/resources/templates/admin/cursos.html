<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cursos e disciplinas')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <h1 class="h3 mb-3">Cursos e disciplinas</h1>
    <p class="text-muted small"><span class="req" aria-hidden="true">*</span> campo obrigatório</p>

    <div class="row g-3 mb-4">
        <div class="col-12 col-lg-4">
            <div class="card h-100"><div class="card-body">
                <h2 class="h5">Novo curso</h2>
                <form method="post" th:action="@{/admin/cursos}">
                    <label for="nomeCurso" class="form-label">Nome do curso <span class="req" aria-hidden="true">*</span></label>
                    <input id="nomeCurso" name="nome" class="form-control mb-3" required maxlength="150">
                    <button type="submit" class="btn btn-primary">Cadastrar curso</button>
                </form>
            </div></div>
        </div>
        <div class="col-12 col-lg-8">
            <div class="card h-100"><div class="card-body">
                <h2 class="h5">Nova disciplina</h2>
                <form method="post" th:action="@{/admin/disciplinas}">
                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <label for="cursoId" class="form-label">Curso <span class="req" aria-hidden="true">*</span></label>
                            <select id="cursoId" name="cursoId" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nome}">Curso</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="nomeDisc" class="form-label">Nome <span class="req" aria-hidden="true">*</span></label>
                            <input id="nomeDisc" name="nome" class="form-control" required maxlength="150">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="codigo" class="form-label">Código <span class="req" aria-hidden="true">*</span></label>
                            <input id="codigo" name="codigo" class="form-control" required maxlength="30">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="carga" class="form-label">Carga horária <span class="req" aria-hidden="true">*</span></label>
                            <input id="carga" name="cargaHoraria" type="number" min="1" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <span class="form-label d-block">Pré-requisitos</span>
                            <div class="ec-checklist" role="group" aria-label="Pré-requisitos da nova disciplina">
                                <p class="text-muted small mb-0" th:if="${disciplinas.isEmpty()}">Nenhuma disciplina cadastrada.</p>
                                <div class="form-check" th:each="d : ${disciplinas}">
                                    <input class="form-check-input" type="checkbox" name="preRequisitos" th:value="${d.id}" th:id="'pre' + ${d.id}">
                                    <label class="form-check-label" th:for="'pre' + ${d.id}" th:text="${d.codigo} + ' – ' + ${d.nome}">Disc</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <label for="ementa" class="form-label">Ementa</label>
                            <textarea id="ementa" name="ementa" class="form-control" rows="2" maxlength="2000"
                                      placeholder="Conteúdos abordados na disciplina"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Cadastrar disciplina</button>
                </form>
            </div></div>
        </div>
    </div>

    <div class="card mb-3" th:each="c : ${cursos}">
        <div class="card-body">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                <h2 class="h5 mb-0 me-auto" th:text="${c.nome}">Curso</h2>
                <details class="ec-inline">
                    <summary class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil" aria-hidden="true"></i> Renomear</summary>
                    <form method="post" th:action="@{/admin/cursos/{id}(id=${c.id})}" class="d-flex gap-2 mt-2">
                        <label class="visually-hidden" th:for="'nomeCurso' + ${c.id}">Novo nome do curso</label>
                        <input th:id="'nomeCurso' + ${c.id}" name="nome" class="form-control form-control-sm" required maxlength="150" th:value="${c.nome}">
                        <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                    </form>
                </details>
                <form method="post" th:action="@{/admin/cursos/{id}/excluir(id=${c.id})}"
                      th:attr="data-confirmar='Excluir o curso ' + ${c.nome} + '?'">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash" aria-hidden="true"></i> Excluir</button>
                </form>
            </div>
            <p class="text-muted mb-2" th:if="${c.disciplinas.isEmpty()}">Nenhuma disciplina cadastrada.</p>
            <div class="table-responsive" th:unless="${c.disciplinas.isEmpty()}">
                <table class="table table-sm mb-0">
                    <thead><tr><th scope="col">Código</th><th scope="col">Disciplina</th><th scope="col">Carga horária</th>
                        <th scope="col">Pré-requisitos</th><th scope="col">Ações</th></tr></thead>
                    <tbody>
                    <tr th:each="d : ${c.disciplinas}">
                        <td th:text="${d.codigo}">COD</td>
                        <td>
                            <span th:text="${d.nome}">Nome</span>
                            <div class="small text-muted ec-ementa" th:if="${d.ementa}" th:text="${d.ementa}">Ementa</div>
                        </td>
                        <td th:text="${d.cargaHoraria} + ' h'">60 h</td>
                        <td>
                            <span class="text-muted" th:if="${d.preRequisitos.isEmpty()}">—</span>
                            <span class="badge text-bg-secondary me-1" th:each="p : ${d.preRequisitos}" th:text="${p.codigo}">COD</span>
                        </td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/disciplinas/{id}/editar(id=${d.id})}"
                               th:attr="aria-label='Editar ' + ${d.nome}">Editar</a>
                            <form class="d-inline" method="post" th:action="@{/admin/disciplinas/{id}/excluir(id=${d.id})}"
                                  th:attr="data-confirmar='Excluir a disciplina ' + ${d.codigo} + '?'">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        th:attr="aria-label='Excluir ' + ${d.nome}">Excluir</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <p class="text-muted" th:if="${cursos.isEmpty()}">Nenhum curso cadastrado ainda.</p>
</main>

<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
