<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Lançar notas')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="conteudo" class="container py-4">
    <div th:replace="~{fragments :: mensagens}"></div>
    <a th:href="@{/professor/turmas/{id}(id=${turma.id})}" class="small">&larr; Voltar à turma</a>
    <h1 class="h3 my-3" th:text="'Notas – ' + ${avaliacao.nome}">Notas</h1>
    <p class="text-muted" th:text="${turma.disciplina.nome} + ' – turma ' + ${turma.codigo} + '. Valor máximo: '
       + ${#numbers.formatDecimal(avaliacao.valorMaximo, 1, 1, 'COMMA')}">Info</p>

    <p class="text-muted" th:if="${turma.alunos.isEmpty()}">A turma ainda não tem alunos vinculados.</p>
    <form method="post" th:action="@{/professor/avaliacoes/{id}/notas(id=${avaliacao.id})}" th:unless="${turma.alunos.isEmpty()}">
        <div class="card">
            <div class="table-responsive">
                <table class="table mb-0">
                    <caption class="visually-hidden">Notas dos alunos</caption>
                    <thead><tr><th scope="col">Aluno</th><th scope="col">Nota</th><th scope="col">Observações</th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${turma.alunos}">
                        <td th:text="${a.nomeCompleto}">Aluno</td>
                        <td>
                            <label class="visually-hidden" th:for="'valor_' + ${a.id}" th:text="'Nota de ' + ${a.nomeCompleto}">Nota</label>
                            <input class="form-control nota-input" th:id="'valor_' + ${a.id}" th:name="'valor_' + ${a.id}"
                                   inputmode="decimal"
                                   th:value="${notas[a.id] != null} ? ${#numbers.formatDecimal(notas[a.id].valor, 1, 1, 'COMMA')}">
                        </td>
                        <td>
                            <label class="visually-hidden" th:for="'obs_' + ${a.id}" th:text="'Observações de ' + ${a.nomeCompleto}">Obs</label>
                            <input class="form-control" th:id="'obs_' + ${a.id}" th:name="'obs_' + ${a.id}" maxlength="255"
                                   th:value="${notas[a.id] != null} ? ${notas[a.id].observacoes}">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <p class="form-text">Use vírgula ou ponto nos decimais. Campos vazios são ignorados.</p>
        <button type="submit" class="btn btn-primary">Salvar notas</button>
    </form>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
<script th:replace="~{fragments :: scripts}"></script>
<script th:replace="~{fragments :: app}"></script>
</body>
</html>
