<!--
  EduConnect - símbolo da marca (arquivo independente, para documentos, slides e favicon).
  Para mudar as cores, troque os dois valores de stop-color abaixo.
  O mesmo desenho é usado dentro do site em templates/fragments.html (fragmento "simbolo").
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256">
  <defs>
    <linearGradient id="ec-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#ec-grad)"/>
  <path d="M33 14.5 L29.5 24 L33 33.5" fill="none" stroke="#fff" stroke-opacity=".55"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="12" y="12" width="4.5" height="24" rx="2.25" fill="#fff"/>
  <rect x="12" y="12" width="17" height="4.5" rx="2.25" fill="#fff"/>
  <rect x="12" y="21.75" width="13.5" height="4.5" rx="2.25" fill="#fff"/>
  <rect x="12" y="31.5" width="17" height="4.5" rx="2.25" fill="#fff"/>
  <circle cx="33" cy="14.25" r="3.6" fill="#fff"/>
  <circle cx="29.5" cy="24" r="3.6" fill="#fff"/>
  <circle cx="33" cy="33.75" r="3.6" fill="#fff"/>
</svg>
