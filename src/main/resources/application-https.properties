# RNF-S.4 - HTTPS. Ative com: --spring.profiles.active=https
# Gere o keystore conforme o README.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=educonnect
server.servlet.session.cookie.secure=true
